services:
  - type: web
    name: educandes-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: educandes-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://educandes.vercel.app

databases:
  - name: educandes-db
    databaseName: educandes_db
    user: educandes
    plan: free
